# ============================================================================
# dsh-bg-atelier-plus —— DSH bundle patch (官方版分支; 原版是 dsh-bg-atelier)
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch,
# 本文件把底图工坊插入 Web profile 的配置树, 使其作为标准 DSH 插件
# 随启动自动加载、重启保留、可在设置 → 插件里开启/关闭。
#
# 安装方式 (无需手工复制/改 profile patch):
#   dsh plugin --profile web add link:<本目录绝对路径>     # 本地开发安装
#   或发布到仓库后用:
#   dsh plugin --profile web add <repo-url>#<ref>
# ============================================================================

# ============================================================================
# 2026-09-22 v1.7.0：新增 WE 壁纸库（/bga/we/*）与 scene.pkg 解包出静态图
#   （/bga/we/still…）—— 这些是 **host 半** 路由，随 bundle 在启动时注册；
#   改完 host 代码要重启 DSH Desktop（或让宿主重载本 bundle）才生效，
#   而 client 半是按请求重建的，刷新窗口即可。
# ============================================================================

# 包名必须跟着 package.json 走: 改成 plus 之后这里的 name 如果还写 dsh-bg-atelier,
# 宿主就 import 不到 (启动日志: "bg-atelier (dsh-bg-atelier): failed to import")。
- insert:
    - id: bg-atelier-plus
      name: dsh-bg-atelier-plus
